# Licensing of every file in the REUSE 3.x format (https://reuse.software/spec-3.3/), so files need no header. The last
# matching annotation applies; `node scripts/oss/reuse-check.mjs` verifies that every file is covered.
version = 1
SPDX-PackageName = "aether-office"
SPDX-PackageSupplier = "haotool"
SPDX-PackageDownloadLocation = "https://github.com/haotool/aether-office"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 haotool and the AETHER OFFICE contributors"
SPDX-License-Identifier = "MIT"

# Adapted from AgentSystemLabs/agent-office (MIT), the project this one started from.
[[annotations]]
path = ["tools/blender/aokit.py", "tools/blender/build_animals.py", "packages/office-scene/src/environment/geometry.ts"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 AgentSystemLabs", "2026 haotool and the AETHER OFFICE contributors"]
SPDX-License-Identifier = "MIT"

# Models and textures generated by tools/blender with the kit above (see docs/legal/provenance.md).
[[annotations]]
path = ["apps/web/public/assets/animals/**", "assets-source/animals/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 haotool and the AETHER OFFICE contributors", "2026 AgentSystemLabs"]
SPDX-License-Identifier = "MIT"

# Secret patterns adapted from stablyai/orca (MIT), src/shared/crash-report-redaction.ts at commit 373d951b.
[[annotations]]
path = "apps/control/src/services/platform/redaction.ts"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Lovecast Inc.", "2026 haotool and the AETHER OFFICE contributors"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packages/providers/generated/codex-0.159.2-ts/**"
precedence = "override"
SPDX-FileCopyrightText = "2025 OpenAI"
SPDX-License-Identifier = "Apache-2.0"

# Adapted from the Contributor Covenant 2.1 (https://www.contributor-covenant.org).
[[annotations]]
path = ".github/CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = ["Contributor Covenant contributors", "2026 haotool and the AETHER OFFICE contributors"]
SPDX-License-Identifier = "CC-BY-4.0"
