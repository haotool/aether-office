version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    groups:
      sdks:
        patterns: ['@agentclientprotocol/claude-agent-acp', '@anthropic-ai/claude-agent-sdk']
      prod:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]
      major:
        update-types: [major]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
