version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    # 2.0 removes the connection classes that packages/providers/src/acp.ts uses.
    ignore: [{ dependency-name: '@agentclientprotocol/sdk', versions: ['2.x'] }]
    groups:
      sdks:
        patterns: ['@agentclientprotocol/claude-agent-acp', '@anthropic-ai/claude-agent-sdk']
      prod:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
