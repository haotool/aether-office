name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request title becomes the squash-merge subject; the commits must follow the same convention (CONTRIBUTING.md).
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/oss/commit-msg.sh --subject "$TITLE"
      - name: Commit subjects
        env:
          BASE: ${{ github.base_ref }}
        run: bash scripts/oss/commit-msg.sh --range "origin/$BASE..HEAD"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verification:check
      - run: node scripts/check-bundle-size.mjs
      # After the build, so the ignore rules are also proven against the build output.
      - run: pnpm run oss:check
      # After the build, so that the bundle budgets are measured.
      - run: pnpm run quality:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

  # Unit tests also run on macOS (vm_stat, ps and lsof parsing); the slow browser suite stays on Linux.
  unit-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Registry advisory gate: high and critical findings fail unless time-boxed in docs/security/audit-exceptions.json.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:gate
