name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate title and commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
        run: |
          bash scripts/oss/commit-msg.sh --subject "$TITLE"
          bash scripts/oss/commit-msg.sh --range "origin/$BASE..HEAD"
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Validate source and build
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm build
          pnpm verification:check
          node scripts/check-bundle-size.mjs
          pnpm run oss:check
          pnpm run quality:check
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm audit:gate
      - name: Linux browser workflows
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test e2e/session/local-sessions.spec.ts e2e/session/pairing.spec.ts e2e/workbench/composer.spec.ts e2e/workbench/native-workflow.spec.ts --timeout=120000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && matrix.os == 'ubuntu-latest'
        with:
          name: linux-browser-failures
          path: |
            evidence/e2e-results.json
            test-results/
  check: &verified
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
  audit: *verified
