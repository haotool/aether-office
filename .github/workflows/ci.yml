name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate title and commits
        env: { TITLE: '${{ github.event.pull_request.title }}', BASE: '${{ github.base_ref }}' }
        run: |
          bash scripts/oss/commit-msg.sh --subject "$TITLE"
          bash scripts/oss/commit-msg.sh --range "origin/$BASE..HEAD"
  verify:
    env:
      AETHER_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Validate source and build
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm build
          pnpm verification:check
          node scripts/check-bundle-size.mjs
          pnpm run oss:check
          pnpm run quality:check
      - if: matrix.os == 'ubuntu-24.04'
        run: pnpm audit:gate
      - name: Linux browser workflows
        if: matrix.os == 'ubuntu-24.04'
        env: { TMPDIR: '${{ runner.temp }}', AETHER_E2E_RETRIES: '0' }
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test e2e/session/local-sessions.spec.ts e2e/session/pairing.spec.ts e2e/workbench/composer.spec.ts e2e/workbench/native-workflow.spec.ts --timeout=120000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.os == 'ubuntu-24.04'
        with:
          name: linux-browser-results
          path: |
            evidence/e2e-results.json
            test-results/
  check:
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env: { RESULT: '${{ needs.verify.result }}' }
        run: test "$RESULT" = success
