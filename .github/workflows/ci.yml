name: CI

# Every push and pull request is typechecked, linted (module boundaries and design tokens), format-checked, unit
# tested, built and driven through a real browser. Nothing is published and no paid model is called.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request title becomes the squash-merge subject; the commits must follow the same convention (CONTRIBUTING.md).
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/oss/commit-msg.sh --subject "$TITLE"
      - name: Commit subjects
        env:
          BASE: ${{ github.base_ref }}
        run: bash scripts/oss/commit-msg.sh --range "origin/$BASE..HEAD"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
